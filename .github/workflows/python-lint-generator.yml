name: Python Lint and Security Generator Server

on:
  push:
    branches: [ "*" ]

jobs:
  lint_tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    name: Linting
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: '${{ github.workspace }}/src'
          activate-environment: "true"

      - name: Install dependencies
        run: |
          uv pip install ruff bandit

      - name: Run Ruff
        run: |
          cd src/server
          uvx ruff check .
          uvx ruff format --check .

      - name: Run bandit
        run: |
          cd src/          
          uvx bandit -c bandit.yaml b-r .